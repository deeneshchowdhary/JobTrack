name: Bug report
description: Report reproducible behavior that is not working as expected
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve JobTrack. Do not include credentials or personal data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start...
        2. Send...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main or a commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, .NET SDK version, database, and relevant tooling.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal information first.
      render: shell
