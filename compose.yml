name: jobtrack

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-JobTrack_Local_2026!}"
    ports:
      - "${JOBTRACK_DB_PORT:-1433}:1433"
    volumes:
      - jobtrack-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: JobTrack.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=JobTrack;User Id=sa;Password=${MSSQL_SA_PASSWORD:-JobTrack_Local_2026!};Encrypt=True;TrustServerCertificate=True;"
      Database__MigrateOnStartup: "true"
      Jwt__Issuer: "JobTrack.Api"
      Jwt__Audience: "JobTrack.Client"
      Jwt__SigningKey: "${JOBTRACK_JWT_SIGNING_KEY:-JobTrack_Local_JWT_Key_Change_Me_2026!}"
    ports:
      - "${JOBTRACK_API_PORT:-5208}:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${JOBTRACK_WEB_PORT:-4200}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  jobtrack-sql-data:
