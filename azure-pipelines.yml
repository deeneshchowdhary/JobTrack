trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  solutionPath: JobTrack.slnx
  projectPath: JobTrack.Api/JobTrack.Api.csproj
  functionsProjectPath: JobTrack.Functions/JobTrack_Functions.csproj
  artifactName: jobtrack-api
  functionsArtifactName: jobtrack-functions
  azureSubscription: jobtrack-azure-connection
  appServiceName: jobtrack-api-deenesh

stages:
  - stage: Build
    displayName: Build and test

    jobs:
      - job: BuildSolution
        displayName: Build API and Functions

        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: "10.x"

          - task: DotNetCoreCLI@2
            displayName: Restore solution
            inputs:
              command: restore
              projects: "$(solutionPath)"

          - task: DotNetCoreCLI@2
            displayName: Build solution
            inputs:
              command: build
              projects: "$(solutionPath)"
              arguments: >
                --configuration $(buildConfiguration)
                --no-restore

          - task: DotNetCoreCLI@2
            displayName: Run unit tests
            inputs:
              command: test
              projects: "JobTrack.Api.Tests/JobTrack.Api.Tests.csproj"
              arguments: >
                --configuration $(buildConfiguration)
                --no-build
                --no-restore
                --logger trx
                --collect "XPlat Code Coverage"
              publishTestResults: true

          - task: DotNetCoreCLI@2
            displayName: Publish API
            inputs:
              command: publish
              publishWebProjects: false
              projects: "$(projectPath)"
              arguments: >
                --configuration $(buildConfiguration)
                --output $(Build.ArtifactStagingDirectory)/api
                --no-build
                --no-restore
              zipAfterPublish: true

          - task: PublishPipelineArtifact@1
            displayName: Publish API artifact
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/api"
              artifact: "$(artifactName)"

          - task: DotNetCoreCLI@2
            displayName: Publish Azure Functions
            inputs:
              command: publish
              publishWebProjects: false
              projects: "$(functionsProjectPath)"
              arguments: >
                --configuration $(buildConfiguration)
                --output $(Build.ArtifactStagingDirectory)/functions
                --no-build
                --no-restore
              zipAfterPublish: true

          - task: PublishPipelineArtifact@1
            displayName: Publish Azure Functions artifact
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/functions"
              artifact: "$(functionsArtifactName)"

  - stage: Deploy
    displayName: Deploy to Azure
    dependsOn: Build
    condition: succeeded()

    jobs:
      - deployment: DeployApi
        displayName: Deploy JobTrack API
        environment: production

        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  displayName: Download API artifact
                  inputs:
                    artifact: "$(artifactName)"
                    path: "$(Pipeline.Workspace)/$(artifactName)"

                - task: AzureWebApp@1
                  displayName: Deploy App Service
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    appType: webAppLinux
                    appName: "$(appServiceName)"
                    package: >
                      $(Pipeline.Workspace)/$(artifactName)/**/*.zip
